services:
  backend1:
    build: .
    image: fitness-tracker-backend:latest
    container_name: backend1
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    expose:
      - "5000"
    restart: unless-stopped

  backend2:
    build: .
    image: fitness-tracker-backend:latest
    container_name: backend2
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    expose:
      - "5000"
    restart: unless-stopped

  backend3:
    build: .
    image: fitness-tracker-backend:latest
    container_name: backend3
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
